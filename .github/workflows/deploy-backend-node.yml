name: Deploy Backend to Node App

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Backend/**'
      - '.github/workflows/deploy-backend-node.yml'
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm install

      - name: Build backend
        working-directory: Backend
        run: npm run build

      - name: Sync files to server (via SSH/rsync)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: Backend/dist/ Backend/package.json Backend/package-lock.json Backend/prisma/
          remote_path: ${{ secrets.SSH_APP_ROOT }}/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install deps + Prisma + restart (sur le serveur)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            source ${{ secrets.SSH_NODEVENV_PATH }}/bin/activate
            cd ${{ secrets.SSH_APP_ROOT }}
            npm ci --omit=dev
            npx prisma generate
            npx prisma migrate deploy
            /usr/sbin/cloudlinux-selector restart --json --interpreter=nodejs --app-root=${{ secrets.SSH_APP_ROOT }}